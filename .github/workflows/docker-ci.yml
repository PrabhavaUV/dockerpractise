name: Build and push
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Docker hub
        uses: docker/login-action@v4
        with: 
          username: prabhavauv
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: prabhavauv/ci-demo:latest